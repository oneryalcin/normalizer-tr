[package]
name = "normalizer-tr-wasm"
version = "0.7.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
description = "WebAssembly binding for the bounded Rust Turkish text normalizer"
repository = "https://github.com/erdemtuna/normalizer-tr"
publish = false

# Standalone workspace: keeps wasm-only dependencies out of the root lockfile.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
normalizer-tr = { path = "../..", version = "=0.7.0" }
wasm-bindgen = "=0.2.129"
js-sys = "=0.3.106"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"

[lints.rust]
unsafe_code = "forbid"
